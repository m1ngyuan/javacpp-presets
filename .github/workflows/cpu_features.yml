name: cpu_features
on:
  push:
    paths:
      - cpu_features/**
      - .github/workflows/cpu_features.yml
  pull_request:
    paths:
      - cpu_features/**
      - .github/workflows/cpu_features.yml
  workflow_dispatch:
env:
  CI_DEPLOY_MODULE: ${{ github.workflow }}
  CI_DEPLOY_PLATFORM: ${{ github.job }}
  CI_DEPLOY_SETTINGS: ${{ secrets.CI_DEPLOY_SETTINGS }}
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  STAGING_REPOSITORY: ${{ secrets.STAGING_REPOSITORY }}
jobs:
  android-arm:
    runs-on: ubuntu-22.04
    container: centos:7
    steps:
      - uses: m1ngyuan/javacpp-presets/.github/actions/deploy-centos@actions-cpu
  android-arm64:
    runs-on: ubuntu-22.04
    container: centos:7
    steps:
      - uses: m1ngyuan/javacpp-presets/.github/actions/deploy-centos@actions-cpu
  android-x86:
    runs-on: ubuntu-22.04
    container: centos:7
    steps:
      - uses: m1ngyuan/javacpp-presets/.github/actions/deploy-centos@actions-cpu
  android-x86_64:
    runs-on: ubuntu-22.04
    container: centos:7
    steps:
      - uses: m1ngyuan/javacpp-presets/.github/actions/deploy-centos@actions-cpu
  linux-armhf:
    runs-on: ubuntu-22.04
    container: ubuntu:bionic
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
  linux-arm64:
    runs-on: ubuntu-22.04
    container: ubuntu:bionic
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
  linux-ppc64le:
    runs-on: ubuntu-22.04
    container: ubuntu:bionic
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
  linux-x86:
    runs-on: ubuntu-22.04
    container: centos:7
    steps:
      - uses: m1ngyuan/javacpp-presets/.github/actions/deploy-centos@actions-cpu
  linux-x86_64:
    runs-on: ubuntu-22.04
    container: centos:7
    steps:
      - uses: m1ngyuan/javacpp-presets/.github/actions/deploy-centos@actions-cpu
  macosx-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-macosx@actions
  windows-x86:
    runs-on: windows-2022
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-windows@actions
  windows-x86_64:
    runs-on: windows-2022
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-windows@actions
  redeploy:
    needs: [android-arm, android-arm64, android-x86, android-x86_64, linux-armhf, linux-arm64, linux-ppc64le, linux-x86, linux-x86_64, macosx-arm64, macosx-x86_64, windows-x86, windows-x86_64]
    runs-on: ubuntu-22.04
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/redeploy@actions
